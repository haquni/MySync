[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mysync"
version = "0.1.0"
description = "Local-network file synchronization for Windows and Linux."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
MySync = "mysync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["mysync*"]
